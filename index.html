    window.addEventListener('error', function(e) {
      console.error("VLSIVerse Runtime Exception Caught:", e.error || e.message, "at", e.filename, ":", e.lineno);

      if (appRoot && appRoot.innerHTML.includes("BOOTING VLSIVERSE ENGINE")) {

          </div>
        `;
      }
    });
  </script>
