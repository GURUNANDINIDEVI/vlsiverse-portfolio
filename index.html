<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <!-- SEO Optimization -->
  <script>
    window.addEventListener('error', function(e) {
      console.error("Global Error Caught:", e);
      var errDiv = document.createElement('div');
      errDiv.className = 'load-error-banner';
      errDiv.style.position = 'fixed';
      var existing = document.querySelectorAll('.load-error-banner').length;
      errDiv.style.top = (existing * 60) + 'px';
      errDiv.style.left = '0';
      errDiv.style.width = '100%';
      errDiv.style.background = '#881337';
      errDiv.style.color = '#fecdd3';
      errDiv.style.padding = '12px';
      errDiv.style.zIndex = '99999';
      errDiv.style.fontFamily = 'monospace';
      errDiv.style.fontSize = '12px';
      errDiv.style.borderBottom = '3px solid #f43f5e';
      errDiv.innerHTML = '<strong>[VLSIVerse Load Error]:</strong> ' + e.message + ' at ' + e.filename + ':' + e.lineno;
      document.body.appendChild(errDiv);
    });
  </script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VLSIVerse - World's Premium Silicon Design Practice Engine</title>
  <meta name="description" content="Master semiconductor engineering, RTL Verilog, SystemVerilog, UVM, and physical design flows with 300+ challenges, visual labs, and 100+ interview preps.">
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            slate: {
              950: '#05070f',
            }
          },
          fontSize: {
            '2xs': '0.75rem',     // 12px
            'xs': '0.875rem',     // 14px (was 12px)
            'sm': '1.05rem',      // 16.8px (was 14px)
            'base': '1.2rem',     // 19.2px (was 16px)
            'lg': '1.35rem',      // 21.6px (was 18px)
            'xl': '1.5rem',       // 24px (was 20px)
            '2xl': '1.85rem',     // 29.6px (was 24px)
            '3xl': '2.25rem',     // 36px (was 30px)
            '4xl': '2.75rem',     // 44px (was 36px)
            '5xl': '3.25rem',     // 52px (was 48px)
            '6xl': '4.25rem',     // 68px (was 60px)
          }
        }
      }
    }
  </script>

  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" integrity="sha512-iecdLmaskl7CVkqkXNQ/ZH/XLlvWZOJyj7Yy7tcenmpD1ypASozpmT/E0iPtmFIB46ZmdtAc9eNBvH0H/ZpiBw==" crossorigin="anonymous" referrerpolicy="no-referrer" />

  <!-- Custom Stylesheets -->
  <link rel="stylesheet" href="css/styles.css?v=81">
</head>
<body class="bg-[#05070f] text-gray-200 min-h-screen grid-bg">

  <!-- Animated VLSI Canvas Background -->
  <canvas id="vlsi-bg-canvas" class="fixed inset-0 pointer-events-none z-0 opacity-40"></canvas>

  <!-- Mounting Point for SPA -->
  <div id="app-root" class="relative z-10">
    <!-- Boot Screen -->
    <div class="h-screen w-screen flex flex-col items-center justify-center bg-[#05070f] text-[#f1f5f9]">
      <div class="w-12 h-12 rounded-xl bg-gradient-to-tr from-blue-600 to-cyan-400 flex items-center justify-center glow-border-blue animate-spin mb-4">
        <i class="fa-solid fa-microchip text-white text-xl"></i>
      </div>
      <h2 class="font-heading font-bold text-sm tracking-wider text-glow-cyan text-blue-400 animate-pulse">BOOTING VLSIVERSE ENGINE...</h2>
    </div>
  </div>

  <!-- Toast Overlay Container -->
  <div id="toast-container" class="fixed bottom-6 right-6 z-50 flex flex-col gap-2 pointer-events-none"></div>

  <!-- Data Access Layer -->
  <script src="js/data.js?v=93"></script>

  <!-- Background Animation Engine -->

  <!-- View Controllers -->
  <script src="js/views/home.js?v=93"></script>

  <script src="js/views/practice.js?v=93"></script>
  <script src="js/views/digital_practice.js?v=93"></script>
  <script src="js/views/protocols.js?v=93"></script>
  <script src="js/views/asic.js?v=93"></script>
  <script src="js/views/projects.js?v=93"></script>
  <script src="js/views/interviews.js?v=93"></script>
  <script src="js/views/dashboard.js?v=93"></script>
  <script src="js/views/admin.js?v=93"></script>
  <script src="js/views/studio.js?v=93"></script>
  <script src="js/views/auth.js?v=93"></script>

  <!-- Application Shell Router -->
  <script src="js/app.js?v=93"></script>

</body>
</html>
